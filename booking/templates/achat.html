<!DOCTYPE html>
<html>
<head>
    <title>Commander des places Arkose</title>
</head>
<body style="font-family: Arial, sans-serif; padding: 20px;">
    
    <h1>Réservation de places</h1>
    <p>Connecté en tant que : <b>{{ user.username }}</b></p>
    <hr>

    <!-- Si la commande vient d'être passée, on affiche le message de succès -->
    {% if message %}
        <h3 style="color: green;">{{ message }}</h3>
        <a href="/">Retour à l'accueil</a>
    
    <!-- Sinon, on affiche le formulaire de commande -->
    {% else %}
        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" style="background-color: #2c3e50; color: white; padding: 10px 20px;">Confirmer la demande</button>
        </form>
    {% endif %}

</body>
</html>
