<!DOCTYPE html>
<html>
<head>
    <title>Connexion - Revente de places</title>
</head>
<body style="font-family: Arial, sans-serif; padding: 20px;">
    
    <h1>Se connecter</h1>
    
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" style="background-color: #3498db; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer;">
            Connexion
        </button>
    </form>
    
    <br>
    <p>Pas encore de compte ? <a href="/inscription/">Créer une demande d'inscription</a></p>

</body>
</html>
