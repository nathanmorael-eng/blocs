<!DOCTYPE html>
<html>
<head>
    <title>Accueil - Revente de places</title>
    <style>
        /* Style global basique pour une page plus propre */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f8f9fa;
        }

        /* Le bloc de la bannière */
        .banniere-accueil {
            background-color: #2c3e50; /* Bleu nuit élégant */
            color: #ffffff;
            text-align: center;
            padding: 80px 20px;
            border-radius: 10px;
            margin-bottom: 40px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        /* Le bouton d'appel à l'action */
        .bouton-banniere {
            background-color: #27ae60; /* Vert dynamique */
            color: white;
            text-decoration: none;
            padding: 15px 30px;
            border-radius: 5px;
            font-size: 18px;
            font-weight: bold;
            display: inline-block;
            margin-top: 20px;
            transition: background-color 0.3s;
        }

        /* Effet au survol du bouton */
        .bouton-banniere:hover {
            background-color: #2ecc71;
        }
    </style>
</head>
<body>
    
    <!-- Début de la Bannière -->
    <div class="banniere-accueil">
        <h1>Billetterie Groupée Arkose</h1>
        <p>Réservez vos places d'escalade au meilleur tarif associatif.</p>
        <a href="/connexion/" class="bouton-banniere">Se connecter</a>
        <a href="/inscription/" class="bouton-banniere">Créer un compte pour commander</a>
    </div>
    <!-- Fin de la Bannière -->

</body>
</html>
